name: wagering-rebuild

x-app: &app
    build:
        context: ..
        dockerfile: docker/Dockerfile
    image: wagering-rebuild
    env_file: ../.env
    environment:
        POSTGRES_HOST: postgres
        AWS_ENDPOINT_URL: http://localstack:4566
    depends_on:
        postgres:
            condition: service_healthy
        localstack:
            condition: service_healthy
        migrate:
            condition: service_completed_successfully
    stop_grace_period: 30s

services:
    migrate:
        <<: *app
        command: ['bun', 'src/apps/migrate/main.ts', 'up']
        depends_on:
            postgres:
                condition: service_healthy
        restart: 'no'

    api:
        <<: *app
        command: ['bun', 'src/apps/api/main.ts']
        environment:
            POSTGRES_HOST: postgres
            AWS_ENDPOINT_URL: http://localstack:4566
            PORT: 3000
        ports:
            - '3000:3000'
        healthcheck:
            test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health/ready']
            interval: 5s
            timeout: 3s
            start_period: 30s
            start_interval: 2s
            retries: 3

    consumer:
        <<: *app
        command: ['bun', 'src/apps/consumer/main.ts']
        deploy:
            replicas: 3

    outbox-publisher:
        <<: *app
        command: ['bun', 'src/apps/outbox-publisher/main.ts']
        deploy:
            replicas: 2

    reference-worker:
        <<: *app
        command: ['bun', 'src/apps/reference-worker/main.ts']

    postgres:
        image: postgres:16-alpine
        env_file: ../.env
        ports:
            - '5432:5432'
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
            interval: 2s
            timeout: 3s
            retries: 15

    localstack:
        image: localstack/localstack:4.4
        environment:
            SERVICES: sqs
        ports:
            - '4566:4566'
        volumes:
            - ./localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
        healthcheck:
            test: ['CMD', 'awslocal', 'sqs', 'get-queue-url', '--queue-name', 'wager-transactions.fifo']
            interval: 2s
            timeout: 5s
            retries: 30

    prometheus:
        image: prom/prometheus:v2.54.1
        ports:
            - '9090:9090'
        volumes:
            - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        depends_on:
            - api

    loki:
        image: grafana/loki:3.1.1
        command: ['-config.file=/etc/loki/local-config.yaml']

    alloy:
        image: grafana/alloy:v1.3.1
        command: ['run', '/etc/alloy/config.alloy', '--storage.path=/var/lib/alloy/data']
        volumes:
            - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
        depends_on:
            - loki

    grafana:
        image: grafana/grafana:11.2.0
        environment:
            GF_AUTH_ANONYMOUS_ENABLED: 'true'
            GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
            GF_AUTH_DISABLE_LOGIN_FORM: 'true'
            GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/wagering.json
        ports:
            - '3030:3000'
        volumes:
            - ./grafana/provisioning:/etc/grafana/provisioning:ro
            - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
        depends_on:
            - prometheus
            - loki

volumes:
    postgres-data:
